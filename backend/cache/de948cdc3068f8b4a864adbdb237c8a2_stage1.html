<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>综合教育 · 基本学习过程交互式模拟</title>
    <script src="https://cdn.tailwindcss.com">
    </script>
    <style>
        :root {
            --step1-color: #3B82F6;
            --step1-light: #EFF6FF;
            --step1-glow: rgba(59, 130, 246, 0.35);
            --step2-color: #10B981;
            --step2-light: #ECFDF5;
            --step2-glow: rgba(16, 185, 129, 0.35);
            --step3-color: #F59E0B;
            --step3-light: #FFFBEB;
            --step3-glow: rgba(245, 158, 11, 0.35);
            --text-primary: #1E293B;
            --text-secondary: #475569;
            --text-muted: #64748B;
            --surface: #FFFFFF;
            --border: #E2E8F0;
            --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.05);
            --shadow-md: 0 4px 6px rgba(0, 0, 0, 0.07);
            --shadow-lg: 0 10px 25px rgba(0, 0, 0, 0.10);
            --radius: 16px;
            --transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * {
            box-sizing: border-box;
        }

        body {
            font-family: 'Source Han Sans CN', 'Microsoft YaHei', 'SimHei', 'PingFang SC', 'Noto Sans SC', sans-serif;
            background: #F1F5F9;
            color: var(--text-primary);
            line-height: 1.7;
            min-height: 100vh;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        /* 背景装饰 */
        body::before {
            content: '';
            position: fixed;
            top: -180px;
            right: -180px;
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, rgba(59, 130, 246, 0.06) 0%, transparent 70%);
            border-radius: 50%;
            pointer-events: none;
            z-index: 0;
        }
        body::after {
            content: '';
            position: fixed;
            bottom: -140px;
            left: -140px;
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, rgba(16, 185, 129, 0.05) 0%, transparent 70%);
            border-radius: 50%;
            pointer-events: none;
            z-index: 0;
        }

        .simulation-container {
            position: relative;
            z-index: 1;
        }

        /* 左侧过程面板 */
        .process-panel {
            background: var(--surface);
            border-radius: var(--radius);
            box-shadow: var(--shadow-lg);
            padding: 28px 24px 24px;
            border: 1px solid var(--border);
            position: relative;
            transition: var(--transition);
        }
        .process-panel::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(90deg, var(--step1-color), var(--step2-color), var(--step3-color));
            border-radius: 16px 16px 0 0;
            opacity: 0.8;
        }

        .process-panel-title {
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 8px;
            letter-spacing: 0.02em;
        }
        .process-panel-title .icon {
            width: 32px;
            height: 32px;
            border-radius: 8px;
            background: #F8FAFC;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1rem;
        }

        /* 步骤卡片 */
        .step-card {
            position: relative;
            padding: 16px 18px 16px 52px;
            border-radius: 12px;
            margin-bottom: 12px;
            cursor: pointer;
            transition: all 0.35s cubic-bezier(0.4, 0, 0.2, 1);
            border: 2px solid transparent;
            background: #F8FAFC;
            user-select: none;
            min-height: 80px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }
        .step-card:hover {
            transform: translateX(3px);
            box-shadow: var(--shadow-md);
        }
        .step-card .step-number {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            width: 30px;
            height: 30px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 0.85rem;
            transition: var(--transition);
            background: #E2E8F0;
            color: #64748B;
            flex-shrink: 0;
        }
        .step-card .step-title {
            font-weight: 600;
            font-size: 0.95rem;
            color: var(--text-primary);
            margin-bottom: 2px;
            transition: var(--transition);
            letter-spacing: 0.01em;
        }
        .step-card .step-desc {
            font-size: 0.8rem;
            color: var(--text-muted);
            transition: var(--transition);
            line-height: 1.5;
        }
        .step-card .step-check {
            position: absolute;
            right: 16px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 1.2rem;
            opacity: 0;
            transition: all 0.4s ease;
            color: #10B981;
        }

        /* 步骤状态 */
        .step-card[data-state="active"] {
            border-color: var(--step1-color);
            background: var(--step1-light);
            box-shadow: 0 0 0 4px var(--step1-glow);
        }
        .step-card[data-state="active"] .step-number {
            background: var(--step1-color);
            color: #fff;
            box-shadow: 0 2px 8px var(--step1-glow);
        }
        .step-card[data-state="active"] .step-title {
            color: var(--step1-color);
        }

        .step-card[data-state="active"][data-step="2"] {
            border-color: var(--step2-color);
            background: var(--step2-light);
            box-shadow: 0 0 0 4px var(--step2-glow);
        }
        .step-card[data-state="active"][data-step="2"] .step-number {
            background: var(--step2-color);
            color: #fff;
            box-shadow: 0 2px 8px var(--step2-glow);
        }
        .step-card[data-state="active"][data-step="2"] .step-title {
            color: var(--step2-color);
        }

        .step-card[data-state="active"][data-step="3"] {
            border-color: var(--step3-color);
            background: var(--step3-light);
            box-shadow: 0 0 0 4px var(--step3-glow);
        }
        .step-card[data-state="active"][data-step="3"] .step-number {
            background: var(--step3-color);
            color: #fff;
            box-shadow: 0 2px 8px var(--step3-glow);
        }
        .step-card[data-state="active"][data-step="3"] .step-title {
            color: #B45309;
        }

        .step-card[data-state="completed"] {
            border-color: #CBD5E1;
            background: #F1F5F9;
            opacity: 0.75;
        }
        .step-card[data-state="completed"] .step-number {
            background: #10B981;
            color: #fff;
        }
        .step-card[data-state="completed"] .step-check {
            opacity: 1;
        }
        .step-card[data-state="completed"] .step-title {
            color: #475569;
        }

        /* 连接指示条 */
        .step-connector {
            position: absolute;
            right: -8px;
            top: 50%;
            transform: translateY(-50%);
            width: 6px;
            height: 28px;
            border-radius: 3px;
            transition: var(--transition);
            opacity: 0;
            pointer-events: none;
        }
        .step-card[data-state="active"] .step-connector {
            opacity: 1;
        }
        .step-connector.step1 {
            background: var(--step1-color);
        }
        .step-connector.step2 {
            background: var(--step2-color);
        }
        .step-connector.step3 {
            background: var(--step3-color);
        }

        /* 右侧模拟面板 */
        .simulation-panel {
            background: var(--surface);
            border-radius: var(--radius);
            box-shadow: var(--shadow-lg);
            padding: 20px 20px 18px;
            border: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            gap: 14px;
            transition: var(--transition);
        }
        .simulation-panel canvas {
            display: block;
            width: 100%;
            height: auto;
            border-radius: 10px;
            background: #FAFBFC;
            border: 1px solid #E8ECF1;
            cursor: default;
            image-rendering: auto;
        }

        /* 控制按钮 */
        .btn-group {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }
        .btn {
            padding: 10px 20px;
            border-radius: 10px;
            font-weight: 600;
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.25s ease;
            border: none;
            letter-spacing: 0.02em;
            display: flex;
            align-items: center;
            gap: 6px;
            white-space: nowrap;
            font-family: inherit;
        }
        .btn:active {
            transform: scale(0.96);
        }
        .btn-start {
            background: #3B82F6;
            color: #fff;
        }
        .btn-start:hover {
            background: #2563EB;
            box-shadow: 0 4px 14px rgba(59, 130, 246, 0.35);
        }
        .btn-start.paused {
            background: #F59E0B;
        }
        .btn-start.paused:hover {
            background: #D97706;
            box-shadow: 0 4px 14px rgba(245, 158, 11, 0.35);
        }
        .btn-reset {
            background: #F1F5F9;
            color: #475569;
            border: 1.5px solid #CBD5E1;
        }
        .btn-reset:hover {
            background: #E2E8F0;
            border-color: #94A3B8;
        }

        /* 滑块样式 */
        .slider-group {
            display: flex;
            flex-direction: column;
            gap: 4px;
            flex: 1;
            min-width: 140px;
        }
        .slider-group label {
            font-weight: 600;
            font-size: 0.82rem;
            color: var(--text-secondary);
            display: flex;
            align-items: center;
            justify-content: space-between;
            letter-spacing: 0.01em;
        }
        .slider-group label .val {
            font-weight: 700;
            font-size: 0.85rem;
            color: var(--text-primary);
            background: #F1F5F9;
            padding: 2px 10px;
            border-radius: 6px;
            min-width: 38px;
            text-align: center;
        }
        input[type="range"] {
            -webkit-appearance: none;
            width: 100%;
            height: 8px;
            border-radius: 4px;
            background: #E2E8F0;
            outline: none;
            cursor: pointer;
            transition: background 0.2s;
        }
        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 26px;
            height: 26px;
            border-radius: 50%;
            background: #fff;
            border: 2.5px solid #3B82F6;
            cursor: pointer;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.12);
            transition: all 0.2s;
        }
        input[type="range"]::-webkit-slider-thumb:hover {
            transform: scale(1.08);
            box-shadow: 0 4px 12px rgba(59, 130, 246, 0.3);
        }
        #understandingDepthSlider {
            accent-color: #10B981;
        }
        #understandingDepthSlider::-webkit-slider-thumb {
            border-color: #10B981;
        }

        /* 数据面板 */
        .data-panel {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(90px, 1fr));
            gap: 10px;
            background: #F8FAFC;
            border-radius: 12px;
            padding: 14px 16px;
            border: 1px solid #E8ECF1;
        }
        .data-item {
            text-align: center;
            display: flex;
            flex-direction: column;
            gap: 2px;
        }
        .data-item .data-value {
            font-size: 1.3rem;
            font-weight: 700;
            color: var(--text-primary);
            letter-spacing: -0.01em;
            transition: color 0.3s;
        }
        .data-item .data-label {
            font-size: 0.7rem;
            color: var(--text-muted);
            letter-spacing: 0.03em;
            text-transform: uppercase;
        }
        .data-value.highlight-blue {
            color: var(--step1-color);
        }
        .data-value.highlight-green {
            color: var(--step2-color);
        }
        .data-value.highlight-gold {
            color: #B45309;
        }

        /* 鼓励提示 */
        .encouragement-toast {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%) translateY(-120px);
            background: #10B981;
            color: #fff;
            padding: 12px 28px;
            border-radius: 30px;
            font-weight: 700;
            font-size: 0.95rem;
            box-shadow: 0 8px 28px rgba(16, 185, 129, 0.4);
            z-index: 100;
            transition: transform 0.45s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            pointer-events: none;
            letter-spacing: 0.03em;
            white-space: nowrap;
        }
        .encouragement-toast.show {
            transform: translateX(-50%) translateY(0);
        }

        /* 响应式 */
        @media (max-width: 1023px) {
            .process-panel {
                padding: 20px 16px 16px;
            }
            .step-card {
                padding: 14px 14px 14px 44px;
                min-height: 64px;
                margin-bottom: 8px;
            }
            .step-card .step-number {
                left: 10px;
                width: 26px;
                height: 26px;
                font-size: 0.75rem;
            }
            .step-card .step-title {
                font-size: 0.85rem;
            }
            .step-card .step-desc {
                font-size: 0.73rem;
            }
            .simulation-panel {
                padding: 14px 12px 12px;
                gap: 8px;
            }
            .btn {
                padding: 8px 14px;
                font-size: 0.8rem;
            }
            .data-panel {
                gap: 6px;
                padding: 10px 12px;
            }
            .data-item .data-value {
                font-size: 1.05rem;
            }
        }
        @media (min-width: 1024px) {
            .simulation-container .grid {
                align-items: start;
            }
            .process-panel {
                position: sticky;
                top: 20px;
            }
        }
    </style>
</head>
<body class="bg-gray-50">

    <!-- 鼓励提示 -->
    <div class="encouragement-toast" id="encouragementToast"></div>

    <!-- 头部 -->
    <header class="bg-white shadow-sm border-b
