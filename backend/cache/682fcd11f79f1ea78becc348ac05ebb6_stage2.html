<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>综合教育 · 基本学习过程交互式模拟</title>
    <script src="https://cdn.tailwindcss.com">
    </script>
    <style>
        :root {
            --primary: #6366F1;
            --primary-light: #EEF2FF;
            --primary-glow: rgba(99, 102, 241, 0.35);
            --primary-dark: #4F46E5;
            --accent: #8B5CF6;
            --accent-light: #F5F3FF;
            --accent-glow: rgba(139, 92, 246, 0.35);
            --accent-dark: #7C3AED;
            --step1-color: #6366F1;
            --step1-light: #EEF2FF;
            --step1-glow: rgba(99, 102, 241, 0.4);
            --step2-color: #8B5CF6;
            --step2-light: #F5F3FF;
            --step2-glow: rgba(139, 92, 246, 0.4);
            --step3-color: #06B6D4;
            --step3-light: #ECFEFF;
            --step3-glow: rgba(6, 182, 212, 0.4);
            --success: #10B981;
            --success-light: #ECFDF5;
            --text-primary: #1E293B;
            --text-secondary: #475569;
            --text-muted: #64748B;
            --surface: #FFFFFF;
            --border: #E2E8F0;
            --border-light: #F1F5F9;
            --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.04);
            --shadow-md: 0 4px 12px rgba(0, 0, 0, 0.06);
            --shadow-lg: 0 12px 32px rgba(0, 0, 0, 0.08);
            --shadow-xl: 0 20px 48px rgba(0, 0, 0, 0.10);
            --radius-sm: 12px;
            --radius: 20px;
            --radius-lg: 24px;
            --radius-xl: 28px;
            --transition-fast: 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            --transition: 0.35s cubic-bezier(0.4, 0, 0.2, 1);
            --transition-slow: 0.5s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * {
            box-sizing: border-box;
        }

        body {
            font-family: 'Source Han Sans CN', 'Microsoft YaHei', 'SimHei', 'PingFang SC', 'Noto Sans SC', 'Segoe UI', sans-serif;
            background: linear-gradient(180deg, #F8FAFC 0%, #F1F5F9 30%, #EEF2FF 100%);
            color: var(--text-primary);
            line-height: 1.7;
            min-height: 100vh;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            letter-spacing: 0.01em;
            margin: 0;
            padding: 0;
        }

        body::before {
            content: '';
            position: fixed;
            top: -200px;
            right: -160px;
            width: 640px;
            height: 640px;
            background: radial-gradient(circle, rgba(99, 102, 241, 0.07) 0%, transparent 70%);
            border-radius: 50%;
            pointer-events: none;
            z-index: 0;
        }
        body::after {
            content: '';
            position: fixed;
            bottom: -160px;
            left: -120px;
            width: 520px;
            height: 520px;
            background: radial-gradient(circle, rgba(139, 92, 246, 0.06) 0%, transparent 70%);
            border-radius: 50%;
            pointer-events: none;
            z-index: 0;
        }

        .simulation-container {
            position: relative;
            z-index: 1;
            max-width: 1280px;
            margin: 0 auto;
            padding: 16px;
        }

        .process-panel {
            background: var(--surface);
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-lg);
            padding: 28px 22px 22px;
            border: 1px solid var(--border);
            position: relative;
            transition: var(--transition);
            height: 100%;
            display: flex;
            flex-direction: column;
        }
        .process-panel::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 5px;
            background: linear-gradient(90deg, var(--step1-color), var(--step2-color), var(--step3-color));
            border-radius: 24px 24px 0 0;
            opacity: 0.9;
        }

        .process-panel-title {
            font-size: 1.05rem;
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: 18px;
            display: flex;
            align-items: center;
            gap: 10px;
            letter-spacing: 0.02em;
            padding-top: 4px;
        }
        .process-panel-title .icon {
            width: 36px;
            height: 36px;
            border-radius: 10px;
            background: var(--primary-light);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.1rem;
            color: var(--primary);
        }

        .step-card {
            position: relative;
            padding: 15px 16px 14px 50px;
            border-radius: 16px;
            margin-bottom: 10px;
            cursor: pointer;
            transition: all 0.35s cubic-bezier(0.4, 0, 0.2, 1);
            border: 2.5px solid transparent;
            background: #F8FAFC;
            user-select: none;
            min-height: 76px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            outline: none;
            -webkit-tap-highlight-color: transparent;
        }
        .step-card:hover {
            transform: translateX(4px);
            box-shadow: var(--shadow-xl);
        }
        .step-card:focus-visible {
            outline: 3px solid var(--primary);
            outline-offset: 3px;
            border-radius: 16px;
        }
        .step-card .step-number {
            position: absolute;
            left: 12px;
            top: 50%;
            transform: translateY(-50%);
            width: 28px;
            height: 28px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 0.8rem;
            transition: var(--transition);
            background: #E2E8F0;
            color: #64748B;
            flex-shrink: 0;
            line-height: 1;
        }
        .step-card .step-title {
            font-weight: 650;
            font-size: 0.9rem;
            color: var(--text-primary);
            margin-bottom: 1px;
            transition: var(--transition);
            letter-spacing: 0.015em;
        }
        .step-card .step-desc {
            font-size: 0.76rem;
            color: var(--text-muted);
            transition: var(--transition);
            line-height: 1.5;
        }
        .step-card .step-check {
            position: absolute;
            right: 14px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 1.3rem;
            opacity: 0;
            transition: all 0.4s ease;
            color: var(--success);
        }
        .step-card .step-connector {
            position: absolute;
            right: -8px;
            top: 50%;
            transform: translateY(-50%);
            width: 5px;
            height: 24px;
            border-radius: 3px;
            transition: var(--transition);
            opacity: 0;
            pointer-events: none;
        }

        .step-card[data-state="active"] {
            border-color: var(--step1-color);
            background: var(--step1-light);
            box-shadow: 0 0 0 5px var(--step1-glow);
        }
        .step-card[data-state="active"] .step-number {
            background: var(--step1-color);
            color: #fff;
            box-shadow: 0 2px 10px var(--step1-glow);
        }
        .step-card[data-state="active"] .step-title {
            color: var(--step1-color);
        }
        .step-card[data-state="active"] .step-connector {
            opacity: 1;
            background: var(--step1-color);
        }

        .step-card[data-state="active"][data-step="2"] {
            border-color: var(--step2-color);
            background: var(--step2-light);
            box-shadow: 0 0 0 5px var(--step2-glow);
        }
        .step-card[data-state="active"][data-step="2"] .step-number {
            background: var(--step2-color);
            color: #fff;
            box-shadow: 0 2px 10px var(--step2-glow);
        }
        .step-card[data-state="active"][data-step="2"] .step-title {
            color: var(--step2-color);
        }
        .step-card[data-state="active"][data-step="2"] .step-connector {
            background: var(--step2-color);
        }

        .step-card[data-state="active"][data-step="3"] {
            border-color: var(--step3-color);
            background: var(--step3-light);
            box-shadow: 0 0 0 5px var(--step3-glow);
        }
        .step-card[data-state="active"][data-step="3"] .step-number {
            background: var(--step3-color);
            color: #fff;
            box-shadow: 0 2px 10px var(--step3-glow);
        }
        .step-card[data-state="active"][data-step="3"] .step-title {
            color: #0E7490;
        }
        .step-card[data-state="active"][data-step="3"] .step-connector {
            background: var(--step3-color);
        }

        .step-card[data-state="completed"] {
            border-color: #CBD5E1;
            background: #F8FAFC;
            opacity: 0.8;
        }
        .step-card[data-state="completed"] .step-number {
            background: var(--success);
            color: #fff;
        }
        .step-card[data-state="completed"] .step-check {
            opacity: 1;
        }
        .step-card[data-state="completed"] .step-title {
            color: #475569;
        }

        .simulation-panel {
            background: var(--surface);
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-lg);
            padding: 18px;
            border: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            gap: 12px;
            transition: var(--transition);
            height: 100%;
        }
        .simulation-panel canvas {
            display: block;
            width: 100%;
            height: auto;
            border-radius: 16px;
            background: linear-gradient(180deg, #FAFBFC 0%, #F8FAFC 100%);
            border: 1px solid #E8ECF1;
            cursor: default;
            image-rendering: auto;
            box-shadow: inset 0 2px 8px rgba(0, 0, 0, 0.03);
        }

        .btn-group {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }
        .btn {
            padding: 11px 22px;
            border-radius: 14px;
            font-weight: 650;
            font-size: 0.88rem;
            cursor: pointer;
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            border: none;
            letter-spacing: 0.02em;
            display: flex;
            align-items: center;
            gap: 7px;
            white-space: nowrap;
            font-family: inherit;
            outline: none;
            -webkit-tap-highlight-color: transparent;
            min-height: 44px;
            position: relative;
            overflow: hidden;
        }
        .btn:focus-visible {
            outline: 3px solid var(--primary);
            outline-offset: 3px;
            border-radius: 14px;
        }
        .btn:active {
            transform: scale(0.95);
        }
        .btn:hover {
            transform: scale(1.04);
        }
        .btn-start {
            background: var(--primary);
            color: #fff;
            box-shadow: 0 4px 16px rgba(99, 102, 241, 0.3);
        }
        .btn-start:hover {
            background: var(--primary-dark);
            box-shadow: 0 6px 22px rgba(99, 102, 241, 0.4);
            transform: scale(1.05);
        }
        .btn-start.paused {
            background: #F59E0B;
            box-shadow: 0 4px 16px rgba(245, 158, 11, 0.3);
        }
        .btn-start.paused:hover {
            background: #D97706;
            box-shadow: 0 6px 22px rgba(245, 158, 11, 0.4);
        }
        .btn-reset {
            background: #F8FAFC;
            color: var(--text-secondary);
            border: 2px solid #E2E8F0;
        }
        .btn-reset:hover {
            background: #F1F5F9;
            border-color: #94A3B8;
            transform: scale(1.04);
            box-shadow: var(--shadow-md);
        }

        .slider-group {
            display: flex;
            flex-direction: column;
            gap: 3px;
            flex: 1;
            min-width: 130px;
        }
        .slider-group label {
            font-weight: 600;
            font-size: 0.78rem;
            color: var(--text-secondary);
            display: flex;
            align-items: center;
            justify-content: space-between;
            letter-spacing: 0.015em;
        }
        .slider-group label .val {
            font-weight: 700;
            font-size: 0.8rem;
            color: var(--text-primary);
            background: #F1F5F9;
            padding: 3px 10px;
            border-radius: 8px;
            min-width: 36px;
            text-align: center;
        }
        input[type="range"] {
            -webkit-appearance: none;
            width: 100%;
            height: 8px;
            border-radius: 4px;
            background: #E2E8F0;
            outline: none;
            cursor: pointer;
            transition: background 0.2s;
            min-height: 30px;
        }
        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 28px;
            height: 28px;
            border-radius: 50%;
            background: #fff;
            border: 3px solid var(--primary);
            cursor: pointer;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.12);
            transition: all 0.2s;
        }
        input[type="range"]::-webkit-slider-thumb:hover {
            transform: scale(1.1);
            box-shadow: 0 4px 14px rgba(99, 102, 241, 0.35);
        }
        input[type="range"]:focus-visible {
            outline: 3px solid var(--primary);
            outline-offset: 4px;
            border-radius: 4px;
        }
        #understandingDepthSlider {
            accent-color: var(--accent);
        }
        #understandingDepthSlider::-webkit-slider-thumb {
            border-color: var(--accent);
        }

        .data-panel {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(85px, 1fr));
            gap: 10px;
            background: #F8FAFC;
            border-radius: 16px;
            padding: 14px 15px;
            border: 1px solid #E8ECF1;
        }
        .data-item {
            text-align: center;
            display: flex;
            flex-direction: column;
            gap: 1px;
        }
        .data-item .data-value {
            font-size: 1.25rem;
            font-weight: 700;
            color: var(--text-primary);
            letter-spacing: -0.01em;
            transition: color 0.35s;
            line-height: 1.3;
        }
        .data-item .data-label {
            font-size: 0.68rem;
            color: var(--text-muted);
            letter-spacing: 0.04em;
            text-transform: uppercase;
        }
        .data-value.highlight-indigo {
            color: var
